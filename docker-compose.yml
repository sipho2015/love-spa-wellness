services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: love-spa-sql
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${LOVE_SPA_SQL_PASSWORD:?Set LOVE_SPA_SQL_PASSWORD in .env}"
    ports:
      - "1433:1433"
    volumes:
      - lovespa-sql-data:/var/opt/mssql

  backend:
    build:
      context: .
      dockerfile: LoveSpaBackend/Dockerfile
    container_name: love-spa-backend
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=LoveSpaWellnessDb;User Id=sa;Password=${LOVE_SPA_SQL_PASSWORD:?Set LOVE_SPA_SQL_PASSWORD in .env};TrustServerCertificate=True;Encrypt=False"
      Jwt__Key: "${LOVE_SPA_JWT_KEY:?Set LOVE_SPA_JWT_KEY in .env}"
      Jwt__Issuer: "LoveSpaBackend"
      Jwt__Audience: "LoveSpaFrontend"
      Jwt__ExpiryMinutes: "120"
      App__FrontendBaseUrl: "http://localhost:${LOVE_SPA_FRONTEND_PORT:-4200}"
    depends_on:
      - sqlserver
    ports:
      - "5169:8080"

  frontend:
    build:
      context: .
      dockerfile: LoveSpaFrontend/Dockerfile
    container_name: love-spa-frontend
    depends_on:
      - backend
    ports:
      - "${LOVE_SPA_FRONTEND_PORT:-4200}:80"

volumes:
  lovespa-sql-data:
